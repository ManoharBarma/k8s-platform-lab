apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads-project
  namespace: argocd
  labels:
    app.kubernetes.io/name: workloads-project
    app.kubernetes.io/part-of: k8s-platform-lab
spec:
  description: "Argo CD Project for workload applications (e.g. banking-app)"
  
  # Allow application manifests from lab repository and GHCR OCI charts
  sourceRepos:
    - "https://github.com/ManoharBarma/k8s-platform-lab.git"
    - "ghcr.io/manoharbarma"
    - "ghcr.io/manoharbarma/*"

  # Strictly limited to banking-app namespace
  destinations:
    - namespace: banking-app
      server: https://kubernetes.default.svc

  # Allow creating namespaces for applications
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  # Scoped namespace resource permissions
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: "apps"
      kind: Deployment
    - group: "apps"
      kind: StatefulSet
    - group: "networking.k8s.io"
      kind: Ingress
    - group: "autoscaling"
      kind: HorizontalPodAutoscaler
    - group: "gateway.networking.k8s.io"
      kind: "*"
