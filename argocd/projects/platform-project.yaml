apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-project
  namespace: argocd
  labels:
    app.kubernetes.io/name: platform-project
    app.kubernetes.io/part-of: k8s-platform-lab
spec:
  description: "Argo CD Project for Istio Ambient mesh platform components"
  
  # Repositories permitted for this project
  sourceRepos:
    - "https://github.com/ManoharBarma/k8s-platform-lab.git"
    - "https://istio-release.storage.googleapis.com/charts"
    - "https://kubernetes-sigs.github.io/metrics-server/"

  # Scoped destination namespaces
  destinations:
    - namespace: istio-system
      server: https://kubernetes.default.svc
    - namespace: ambient-demo
      server: https://kubernetes.default.svc
    - namespace: metrics-server
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc

  # Strictly scoped cluster-level resources required by CRDs
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "admissionregistration.k8s.io"
      kind: ValidatingWebhookConfiguration
    - group: "admissionregistration.k8s.io"
      kind: MutatingWebhookConfiguration
    - group: "apiregistration.k8s.io"
      kind: APIService

  # Namespaced resources permitted across the target namespaces
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: "apps"
      kind: "*"
    - group: "networking.k8s.io"
      kind: "*"
    - group: "networking.istio.io"
      kind: "*"
    - group: "security.istio.io"
      kind: "*"
    - group: "rbac.authorization.k8s.io"
      kind: "*"
    - group: "autoscaling"
      kind: "*"
    - group: "policy"
      kind: "*"
