apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ambient-demo
  namespace: argocd
  annotations:
    # Sync Wave 1: Deploy base application workloads first
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: ambient-demo
    app.kubernetes.io/part-of: k8s-platform-lab
spec:
  project: applications-project
  source:
    repoURL: https://github.com/ManoharBarma/k8s-platform-lab.git
    targetRevision: HEAD
    path: apps/ambient-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: ambient-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
