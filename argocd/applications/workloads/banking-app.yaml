apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-app
  namespace: argocd
  annotations:
    # Sync Wave 1: Deploy base application workloads first
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: banking-app
    app.kubernetes.io/part-of: k8s-platform-lab
spec:
  project: workloads-project
  source:
    repoURL: https://github.com/ManoharBarma/k8s-platform-lab.git
    targetRevision: HEAD
    path: workloads/banking-app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: banking-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
