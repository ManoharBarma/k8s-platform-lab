apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: kiali
    app.kubernetes.io/part-of: k8s-platform-lab
spec:
  project: platform-project
  sources:
    - repoURL: https://kiali.org/helm-charts
      chart: kiali-server
      targetRevision: 1.89.0
      helm:
        releaseName: kiali-server
        valueFiles:
          - $values/platform/values/kiali.yaml
    - repoURL: https://github.com/ManoharBarma/k8s-platform-lab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kiali
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
