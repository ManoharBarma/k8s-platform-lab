apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-dashboards
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: grafana-dashboards
    app.kubernetes.io/part-of: k8s-platform-lab
spec:
  project: platform-project
  source:
    repoURL: https://github.com/ManoharBarma/k8s-platform-lab.git
    targetRevision: HEAD
    path: platform/dashboards
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
