apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-cluster-health-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana-dashboard
    app.kubernetes.io/part-of: k8s-platform-lab
data:
  k8s-cluster-health.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "☸️ Cluster Overview & Health Gauges",
          "type": "row"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 70 }, { "color": "red", "value": 90 }] },
              "unit": "percent", "max": 100
            }
          },
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 1 },
          "id": 1,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Total Cluster CPU Usage",
          "type": "stat",
          "targets": [{
            "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) * 100",
            "legendFormat": "CPU %"
          }]
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 75 }, { "color": "red", "value": 90 }] },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 1 },
          "id": 2,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Total Container Memory (Working Set)",
          "type": "stat",
          "targets": [{
            "expr": "sum(container_memory_working_set_bytes{container!=\"\"})",
            "legendFormat": "Memory"
          }]
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 1 },
          "id": 3,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Pod Restarts (Last 15m)",
          "type": "stat",
          "targets": [{
            "expr": "sum(changes(kube_pod_container_status_restarts_total[15m]))",
            "legendFormat": "Restarts"
          }]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 101,
          "title": "⚡ Pod Resource Consumption & Top Consumers",
          "type": "row"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": { "unit": "cores", "color": { "mode": "palette-classic" } },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "id": 4,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "title": "CPU Usage by Pod",
          "type": "timeseries",
          "targets": [{
            "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) by (namespace, pod)",
            "legendFormat": "{{namespace}}/{{pod}}"
          }]
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" } },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "id": 5,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "title": "Memory Usage by Pod",
          "type": "timeseries",
          "targets": [{
            "expr": "sum(container_memory_working_set_bytes{container!=\"\"}) by (namespace, pod)",
            "legendFormat": "{{namespace}}/{{pod}}"
          }]
        }
      ],
      "schemaVersion": 39,
      "tags": ["kubernetes", "cluster", "health"],
      "time": { "from": "now-1h", "to": "now" },
      "title": "☸️ Kubernetes Cluster Health & Troubleshooting",
      "uid": "k8s-cluster-health"
    }
