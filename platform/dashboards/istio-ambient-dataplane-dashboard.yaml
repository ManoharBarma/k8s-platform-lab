apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-ambient-dataplane-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana-dashboard
    app.kubernetes.io/part-of: k8s-platform-lab
data:
  istio-ambient-dataplane.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "🔒 ztunnel L4 Proxy Telemetry",
          "type": "row"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": { "unit": "cores", "color": { "mode": "palette-classic" } },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "id": 1,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "title": "ztunnel CPU Usage per Pod",
          "type": "timeseries",
          "targets": [{
            "expr": "sum(rate(container_cpu_usage_seconds_total{container=\"ztunnel\"}[5m])) by (pod)",
            "legendFormat": "{{pod}}"
          }]
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" } },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "id": 2,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "title": "ztunnel Memory Usage per Pod",
          "type": "timeseries",
          "targets": [{
            "expr": "sum(container_memory_working_set_bytes{container=\"ztunnel\"}) by (pod)",
            "legendFormat": "{{pod}}"
          }]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "id": 101,
          "title": "🚪 Waypoint L7 Gateway Telemetry",
          "type": "row"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": { "unit": "reqps", "color": { "mode": "palette-classic" } },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "id": 3,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "title": "Waypoint Request Rate (reporter=waypoint)",
          "type": "timeseries",
          "targets": [{
            "expr": "round(sum(irate(istio_requests_total{reporter=\"waypoint\"}[5m])) by (destination_workload, response_code), 0.001)",
            "legendFormat": "{{destination_workload}} [{{response_code}}]"
          }]
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": { "unit": "ms", "color": { "mode": "palette-classic" } },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "id": 4,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "title": "Waypoint Request Latency P95 (reporter=waypoint)",
          "type": "timeseries",
          "targets": [{
            "expr": "histogram_quantile(0.95, sum(irate(istio_request_duration_milliseconds_bucket{reporter=\"waypoint\"}[5m])) by (le, destination_workload))",
            "legendFormat": "{{destination_workload}} P95"
          }]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 },
          "id": 102,
          "title": "🧠 Istiod Control Plane Health",
          "type": "row"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": { "unit": "cores", "color": { "mode": "palette-classic" } },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 19 },
          "id": 5,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "title": "Istiod Control Plane CPU Usage",
          "type": "timeseries",
          "targets": [{
            "expr": "sum(rate(container_cpu_usage_seconds_total{container=\"discovery\"}[5m])) by (pod)",
            "legendFormat": "{{pod}}"
          }]
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" } },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 19 },
          "id": 6,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "title": "Istiod Control Plane Memory Usage",
          "type": "timeseries",
          "targets": [{
            "expr": "sum(container_memory_working_set_bytes{container=\"discovery\"}) by (pod)",
            "legendFormat": "{{pod}}"
          }]
        }
      ],
      "schemaVersion": 39,
      "tags": ["istio", "ambient", "ztunnel", "waypoint", "istiod"],
      "time": { "from": "now-1h", "to": "now" },
      "title": "🕸️ Istio Ambient Infrastructure Health",
      "uid": "istio-ambient-dataplane"
    }
