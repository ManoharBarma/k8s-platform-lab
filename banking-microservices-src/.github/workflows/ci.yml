name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        run: npm run build

  go-services:
    name: Validate Go Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'
          check-latest: true

      - name: Check Go workspace format
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code not formatted according to gofmt:"
            gofmt -l .
          fi

      - name: Test proto package
        run: go test -v ./proto/...

      - name: Test pkg package
        run: go test -v ./pkg/...
