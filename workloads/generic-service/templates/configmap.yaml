apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.serviceName }}-config
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.serviceName }}
data:
  SERVICE_NAME: {{ .Values.serviceName | quote }}
  ENVIRONMENT: {{ .Values.env.environment | quote }}
  HTTP_PORT: {{ .Values.port | quote }}
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  LOG_FORMAT: {{ .Values.env.logFormat | quote }}
  {{- if .Values.grpcPort }}
  GRPC_ENABLED: "true"
  GRPC_PORT: {{ .Values.grpcPort | quote }}
  {{- end }}
  
  {{- if .Values.db }}
  POSTGRES_ENABLED: "true"
  POSTGRES_HOST: {{ .Values.db.host | quote }}
  POSTGRES_PORT: {{ .Values.db.port | quote }}
  POSTGRES_DB: {{ .Values.db.name | quote }}
  POSTGRES_SSLMODE: {{ .Values.db.sslmode | quote }}
  {{- end }}
  
  {{- if .Values.redis }}
  REDIS_ENABLED: "true"
  REDIS_ADDR: "{{ .Values.redis.servicename }}:{{ .Values.redis.port }}"
  {{- end }}
  
  {{- if .Values.kafka }}
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  {{- end }}
  
  {{- if .Values.otel }}
  OTEL_ENABLED: {{ .Values.otel.enabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_EXPORTER_OTLP_INSECURE: {{ .Values.otel.insecure | quote }}
  {{- end }}
  
  {{- if .Values.corsAllowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ .Values.corsAllowedOrigins | quote }}
  UPSTREAM_SCHEME: "http"
  UPSTREAM_PORT: "8080"
  {{- end }}
