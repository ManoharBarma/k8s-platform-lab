apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ambient-demo-ingress
  namespace: ambient-demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app.kubernetes.io/name: ambient-demo-ingress
    app.kubernetes.io/part-of: ambient-demo
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
