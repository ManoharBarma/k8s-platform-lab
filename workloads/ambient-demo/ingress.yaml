apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ambient-demo-ingress
  namespace: ambient-demo
  annotations:
    # Uses regex capture groups for proper path routing
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  labels:
    app.kubernetes.io/name: ambient-demo-ingress
    app.kubernetes.io/part-of: ambient-demo
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /app(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-service
                port:
                  number: 80
