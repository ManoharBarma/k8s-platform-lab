apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deploymentName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.serviceName }}
    app.kubernetes.io/part-of: banking-platform
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.serviceName }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.port }}"
        prometheus.io/path: "/metrics"
    spec:
      enableServiceLinks: false
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- else if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- else }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      {{- end }}
      containers:
        - name: {{ .Values.serviceName }}
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
          {{- if .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- else }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
            {{- if .Values.grpcPort }}
            - name: grpc
              containerPort: {{ .Values.grpcPort }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Values.serviceName }}-config
            {{- if and .Values.secrets (or .Values.secrets.dbUser .Values.secrets.jwtSecret) }}
            - secretRef:
                name: {{ .Values.serviceName }}-secret
            {{- end }}
          resources:
            {{- if .Values.resources }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- else }}
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: "1"
              memory: 192Mi
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessPath | default "/readyz" }}
              port: {{ .Values.port }}
            initialDelaySeconds: {{ .Values.readinessInitialDelaySeconds | default 5 }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessPath | default "/healthz" }}
              port: {{ .Values.port }}
            initialDelaySeconds: {{ .Values.livenessInitialDelaySeconds | default 10 }}
            periodSeconds: 15
          {{- if ne .Values.startupProbeEnabled false }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupPath | default "/startupz" }}
              port: {{ .Values.port }}
            failureThreshold: 40
            periodSeconds: 3
          {{- end }}

