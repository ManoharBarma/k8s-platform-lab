apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.serviceName }}-config
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.serviceName }}
    app.kubernetes.io/part-of: banking-platform
data:
  SERVICE_NAME: {{ .Values.serviceName | quote }}
  HTTP_PORT: {{ .Values.port | quote }}
  {{- if .Values.env }}
  ENVIRONMENT: {{ .Values.env.environment | default "development" | quote }}
  LOG_LEVEL: {{ .Values.env.logLevel | default "info" | quote }}
  LOG_FORMAT: {{ .Values.env.logFormat | default "json" | quote }}
  {{- end }}
  {{- if .Values.grpcPort }}
  GRPC_ENABLED: "true"
  GRPC_PORT: {{ .Values.grpcPort | quote }}
  {{- end }}
  
  {{- if and .Values.db .Values.db.host }}
  POSTGRES_ENABLED: "true"
  POSTGRES_HOST: {{ .Values.db.host | quote }}
  POSTGRES_PORT: {{ .Values.db.port | default "5432" | quote }}
  POSTGRES_DB: {{ .Values.db.name | quote }}
  POSTGRES_SSLMODE: {{ .Values.db.sslmode | default "disable" | quote }}
  {{- end }}
  
  {{- if and .Values.redis .Values.redis.servicename }}
  REDIS_ENABLED: "true"
  REDIS_ADDR: "{{ .Values.redis.servicename }}:{{ .Values.redis.port | default 6379 }}"
  {{- end }}
  
  {{- if and .Values.kafka .Values.kafka.brokers }}
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  {{- end }}
  
  {{- if and .Values.otel .Values.otel.endpoint }}
  OTEL_ENABLED: {{ .Values.otel.enabled | default "true" | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_EXPORTER_OTLP_INSECURE: {{ .Values.otel.insecure | default "true" | quote }}
  {{- end }}
  
  {{- if .Values.corsAllowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ .Values.corsAllowedOrigins | quote }}
  UPSTREAM_SCHEME: "http"
  UPSTREAM_PORT: "8080"
  {{- end }}
  
  {{- if .Values.extraEnv }}
  {{- range $key, $val := .Values.extraEnv }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}

