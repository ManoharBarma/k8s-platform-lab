serviceName: "my-service"
deploymentName: "my-service-deployment"
namespace: "banking-app"
image: "nginx:latest"
imagePullPolicy: IfNotPresent
imagePullSecrets: []
imagePullSecret: ""

replicas: 1
minReplicas: 1
maxReplicas: 5

port: 8080
grpcPort: ""
serviceType: ClusterIP
nodePort: ""

env:
  environment: development
  logLevel: info
  logFormat: json

db: {}
redis: {}
kafka: {}
otel: {}
secrets: {}
corsAllowedOrigins: ""

# Probe configurations (defaults are for Go microservices)
readinessPath: /readyz
readinessInitialDelaySeconds: 5
readinessPeriodSeconds: 10
livenessPath: /healthz
livenessInitialDelaySeconds: 10
livenessPeriodSeconds: 15
startupProbeEnabled: true
startupPath: /startupz
startupFailureThreshold: 40
startupPeriodSeconds: 3

# Security contexts
podSecurityContext: {}
containerSecurityContext: {}

# Resources
resources: {}

