{{- if and .Values.waypoint .Values.waypoint.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: banking-app
  labels:
    istio.io/waypoint-for: service
    app.kubernetes.io/name: waypoint
    app.kubernetes.io/part-of: banking-app
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
{{- end }}
