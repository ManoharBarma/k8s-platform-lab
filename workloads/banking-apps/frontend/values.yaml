serviceName: frontend
deploymentName: frontend-deployment
namespace: banking-app
image: ghcr.io/manoharbarma/frontend:latest
imagePullPolicy: IfNotPresent
replicas: 1
minReplicas: 1
maxReplicas: 4
port: 8080
serviceType: NodePort
nodePort: 30081

# Frontend HTTP probe paths (SPA index)
readinessPath: /
livenessPath: /
startupProbeEnabled: false

# Nginx needs standard privileges to run and write cache
podSecurityContext: {}
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

env:
  environment: development
  logLevel: info
  logFormat: json

db: {}
redis: {}
kafka: {}
otel: {}
secrets: {}

